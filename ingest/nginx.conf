# AfriTube nginx-rtmp config.
# - Accepts RTMP publish on :1935/live/<stream_key>
# - Calls stream-ingest-auth to validate the key (rejects if 4xx/5xx)
# - Transcodes to a 3-rung HLS ladder written under /tmp/hls/<stream_key>/
# - Records the source stream as flv for replay upload
# - Serves HLS + a stat page on :8080

worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # Auth against the AfriTube edge function.
            # nginx-rtmp POSTs form-encoded fields including `name` (the stream key).
            on_publish       ${INGEST_AUTH_URL}?event=publish;
            on_publish_done  ${INGEST_AUTH_URL}?event=publish_done;

            # Push the incoming RTMP into an HLS-producing app.
            push rtmp://127.0.0.1:1935/hls-out;

            # Record the source for replay/VOD.
            record            all;
            record_path       /var/rec;
            record_unique     on;
            record_suffix     .flv;
        }

        # Internal app: takes the pushed stream, transcodes to HLS ladder.
        application hls-out {
            live on;
            allow publish 127.0.0.1;
            deny  publish all;

            hls on;
            hls_path        /tmp/hls;
            hls_nested      on;
            hls_fragment    2s;
            hls_playlist_length 30s;
            hls_cleanup     on;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;

    server {
        listen 8080;

        # HLS playback
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;

            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range";
        }

        # RTMP stat page (basic diagnostics)
        location /stat {
            rtmp_stat all;
        }

        location /health { return 200 "ok\n"; }
    }
}
