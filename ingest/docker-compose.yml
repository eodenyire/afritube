version: "3.8"

# AfriTube self-hosted RTMP + HLS ingest server (Path A).
# Run on any small Ubuntu VPS with ports 1935 (RTMP) and 8080 (HLS) open.
#
#   cp .env.example .env       # then edit
#   docker compose up -d
#
# OBS ingest URL:  rtmp://<your-host>:1935/live
# OBS stream key:  <stream_key from AfriTube studio>
# Playback URL:    http://<your-host>:8080/hls/<stream_id>/index.m3u8

services:
  rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: afritube-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest
      - "8080:8080"   # HLS playback + stat page
    environment:
      # Full URL of the deployed Supabase edge function.
      # Example: https://<project-ref>.supabase.co/functions/v1/stream-ingest-auth
      INGEST_AUTH_URL: ${INGEST_AUTH_URL}
      # Used by upload-replay.sh to push the finished mp4 to Storage and
      # notify the stream-replay-uploaded edge function.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REPLAY_WEBHOOK_URL: ${REPLAY_WEBHOOK_URL}
      REPLAY_BUCKET: ${REPLAY_BUCKET:-videos}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./upload-replay.sh:/usr/local/bin/upload-replay.sh:ro
      - hls-data:/tmp/hls
      - recordings:/var/rec

volumes:
  hls-data:
  recordings:
